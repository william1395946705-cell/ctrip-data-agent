[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrip-silent-poc"
version = "0.1.0"
description = "Passive Ctrip eBooking API discovery and same-page silent replay POC"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.scripts]
ctrip-silent-poc = "ctrip_silent_poc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
asyncio_mode = "auto"
